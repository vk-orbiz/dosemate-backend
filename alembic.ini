# Used by the Alembic CLI during development, e.g.:
#   uv run alembic revision --autogenerate -m "add todos" --rev-id 0002
# The app and `python -m app.storage.postgres.migrate` build their config in code and do not
# read this file. The database URL is never set here; env.py takes it from Settings.
[alembic]
script_location = %(here)s/app/storage/postgres/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
truncate_slug_length = 40
