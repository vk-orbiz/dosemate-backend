# Run from the backend/ directory:  docker compose -f development/docker-compose.yml up --build
name: dosemate

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dosemate
      POSTGRES_PASSWORD: dosemate
      POSTGRES_DB: dosemate
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      # Postgres 18+ images keep versioned data dirs under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosemate -d dosemate"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      DOSEMATE_DATABASE_URL: postgresql://dosemate:dosemate@postgres:5432/dosemate
    ports:
      - "${APP_PORT:-8010}:8000"

volumes:
  pgdata:
