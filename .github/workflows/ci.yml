name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dosemate
          POSTGRES_PASSWORD: dosemate
          POSTGRES_DB: dosemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dosemate -d dosemate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DOSEMATE_DATABASE_URL: postgresql://dosemate:dosemate@localhost:5432/dosemate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (strict)
        run: uv run mypy app
      - name: Migrations apply to a fresh database and match the models
        run: |
          uv run python -m app.storage.postgres.migrate
          uv run alembic check
      - name: Unit and integration tests (incl. migration tests, single head)
        run: uv run pytest -q
